<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dostęp chroniony</title>
<style>
:root{--navy:#0b1f4d;--cyan:#0aa2c4;--ink:#0f1c3a;--muted:#6b7790;--line:#dfe6f0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:
 radial-gradient(900px 600px at 85% -10%,rgba(10,162,196,.14),transparent 60%),
 radial-gradient(800px 600px at -10% 110%,rgba(31,79,168,.12),transparent 60%),#f4f6fa;
 display:grid;place-items:center;padding:20px;color:var(--ink);-webkit-font-smoothing:antialiased}
.box{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px 30px 28px;box-shadow:0 30px 60px -30px rgba(11,31,77,.35)}
.mk{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),#1f4fa8);display:grid;place-items:center;margin-bottom:18px}
h1{font-size:22px;margin:0;color:var(--navy);letter-spacing:-.02em}
p{margin:6px 0 22px;color:var(--muted);font-size:14.5px}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.f{position:relative}
input{width:100%;font:inherit;font-size:16px;padding:12px 44px 12px 14px;border:1px solid #cfd8e6;border-radius:12px;outline:none;color:var(--navy)}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(10,162,196,.18)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;color:var(--muted);padding:6px;display:grid;place-items:center}
button.go{width:100%;margin-top:16px;border:none;border-radius:12px;padding:13px;font:inherit;font-weight:600;font-size:15px;color:#fff;background:var(--navy);cursor:pointer;transition:.2s}
button.go:hover{background:#1f4fa8}
button.go:disabled{opacity:.7;cursor:wait}
.err{color:#c2410c;font-size:13.5px;margin-top:10px;min-height:18px}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.foot{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="mk"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
  <h1>Dostęp chroniony</h1>
  <p>Ten materiał jest poufny. Wpisz hasło, aby go otworzyć.</p>
  <label for="pw">Hasło</label>
  <div class="f"><input id="pw" type="password" autofocus required><button type="button" class="eye" id="eye" aria-label="Pokaż hasło"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <button class="go" id="go" type="submit">Otwórz</button>
  <div class="err" id="err"></div>
  <div class="foot">Materiał poufny · nie udostępniaj hasła</div>
</form>

const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
document.getElementById('eye').onclick=()=>{const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password';};
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();
  const pw=document.getElementById('pw').value, btn=document.getElementById('go'), err=document.getElementById('err');
  err.textContent=''; btn.disabled=true; btn.textContent='Odszyfrowywanie…';
  try{
    if(!window.crypto||!crypto.subtle) throw new Error('nocrypto');
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
    const html=new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  }catch(ex){
    btn.disabled=false; btn.textContent='Otwórz';
    err.textContent= ex&&ex.message==='nocrypto' ? 'Ta przeglądarka nie obsługuje odszyfrowania. Otwórz plik w Chrome, Edge, Safari lub Firefox.' : 'Nieprawidłowe hasło. Spróbuj ponownie.';
    const f=document.getElementById('f'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    document.getElementById('pw').select();
  }
};
</script>
